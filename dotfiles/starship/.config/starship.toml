# Plain prompt: full path, git branch, no glyphs or powerline blocks.
#   ~/workspace/github/gui-zo/computer-configs (main) $
add_newline = false
format = "$directory$git_branch$git_state$python$character"

[directory]
truncation_length = 0      # never shorten the path
truncate_to_repo = false
home_symbol = "~"
style = "bold white"
read_only = " (ro)"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[\\($branch\\)]($style) "
style = "bright-black"

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "
style = "yellow"

# only shows inside an activated virtualenv
[python]
format = "[\\($virtualenv\\)]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
detect_folders = []

[character]
success_symbol = "[\\$](white)"
error_symbol = "[\\$](red)"
