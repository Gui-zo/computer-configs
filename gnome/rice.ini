# Tokyo Night "Wayland-style" GNOME setup. Applied with: dconf load / < gnome/rice.ini
# Only the keys listed here are changed; everything else is left alone.
#
# Palette (Tokyo Night Night)
#   bg #1a1b26  bg_dark #16161e  bg_hl #292e42  border #414868  comment #565f89
#   fg #c0caf5  blue #7aa2f7  cyan #7dcfff  magenta #bb9af7  green #9ece6a  red #f7768e

# ---------- Look ----------
[org/gnome/desktop/interface]
color-scheme='prefer-dark'
accent-color='blue'
gtk-theme='Tokyonight-Dark'
icon-theme='Papirus-Dark'
cursor-theme='Bibata-Modern-Classic'
monospace-font-name='JetBrainsMono Nerd Font 11'
clock-show-weekday=true
enable-hot-corners=false

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:close'
num-workspaces=5

[org/gnome/mutter]
dynamic-workspaces=false
edge-tiling=false

# ---------- Hyprland-ish keybindings ----------
# Super+1..5 switch workspace, Super+Shift+1..5 move window, Super+Q close
[org/gnome/desktop/wm/keybindings]
close=['<Super>q', '<Alt>F4']
switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
switch-to-workspace-5=['<Super>5']
move-to-workspace-1=['<Super><Shift>1']
move-to-workspace-2=['<Super><Shift>2']
move-to-workspace-3=['<Super><Shift>3']
move-to-workspace-4=['<Super><Shift>4']
move-to-workspace-5=['<Super><Shift>5']

# free Super+N from "launch Nth dock app"
[org/gnome/shell/keybindings]
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
switch-to-application-5=@as []

# Super+Return opens Ghostty
[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ghostty/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ghostty]
name='Ghostty'
command='ghostty'
binding='<Super>Return'

# ---------- Extensions ----------
[org/gnome/shell]
disabled-extensions=['tiling-assistant@ubuntu.com']
enabled-extensions=['ding@rastersoft.com', 'ubuntu-appindicators@ubuntu.com', 'ubuntu-dock@ubuntu.com', 'snapd-prompting@canonical.com', 'snapd-search-provider@canonical.com', 'web-search-provider@ubuntu.com','user-theme@gnome-shell-extensions.gcampax.github.com', 'blur-my-shell@aunetx', 'just-perfection-desktop@just-perfection', 'monitor@astraext.github.io', 'space-bar@luchrioh', 'openbar@neuromorph', 'forge@jmmaranan.com', 'rounded-window-corners@fxgn', 'mediacontrols@cliffniff.github.com', 'clipboard-indicator@tudmotu.com', 'caffeine@patapon.info']

# Tokyo Night shell theme (top bar, menus, overview)
[org/gnome/shell/extensions/user-theme]
name='Tokyonight-Dark'

# Ubuntu dock: always visible, no Super+N hotkeys
[org/gnome/shell/extensions/dash-to-dock]
dock-fixed=true
hot-keys=false

# Floating "islands" bar, waybar-style
# NOTE: Open Bar has no GNOME 50 release (as of 2026-11); settings kept for when it does
[org/gnome/shell/extensions/openbar]
bartype='Islands'
position='Top'
height=34.0
margin=6.0
bradius=12.0
bwidth=2
bordertype='solid'
neon=false
shadow=true
shalpha=0.35
fgcolor=['0.753', '0.792', '0.961']
dark-fgcolor=['0.753', '0.792', '0.961']
bgcolor=['0.102', '0.106', '0.149']
dark-bgcolor=['0.102', '0.106', '0.149']
bgalpha=0.0
iscolor=['0.102', '0.106', '0.149']
dark-iscolor=['0.102', '0.106', '0.149']
isalpha=0.88
bcolor=['0.255', '0.282', '0.408']
dark-bcolor=['0.255', '0.282', '0.408']
balpha=0.9
hcolor=['0.478', '0.635', '0.969']
dark-hcolor=['0.478', '0.635', '0.969']
halpha=0.35
autofg-bar=false
autohg-bar=false
autofg-menu=false
autohg-menu=false
auto-bgalpha=false
bgpalette=false
menustyle=true
mfgcolor=['0.753', '0.792', '0.961']
dark-mfgcolor=['0.753', '0.792', '0.961']
mbgcolor=['0.102', '0.106', '0.149']
dark-mbgcolor=['0.102', '0.106', '0.149']
mbgalpha=0.96
smbgoverride=true
smbgcolor=['0.161', '0.180', '0.259']
dark-smbgcolor=['0.161', '0.180', '0.259']
mbcolor=['0.255', '0.282', '0.408']
dark-mbcolor=['0.255', '0.282', '0.408']
mbalpha=0.9
mhcolor=['0.478', '0.635', '0.969']
dark-mhcolor=['0.478', '0.635', '0.969']
mhalpha=0.3
mscolor=['0.478', '0.635', '0.969']
dark-mscolor=['0.478', '0.635', '0.969']
msalpha=0.9
accent-override=true
accent-color=['0.478', '0.635', '0.969']
dark-accent-color=['0.478', '0.635', '0.969']
menu-radius=14.0
apply-menu-shell=true
apply-accent-shell=true
apply-menu-notif=true
color-scheme='prefer-dark'

# Workspaces in the bar (replaces "Activities")
[org/gnome/shell/extensions/space-bar/appearance]
active-workspace-background-color='rgba(122,162,247,1)'
active-workspace-text-color='rgba(26,27,38,1)'
active-workspace-border-radius=8
inactive-workspace-text-color='rgba(192,202,245,1)'
inactive-workspace-border-radius=8
empty-workspace-text-color='rgba(86,95,137,1)'
empty-workspace-border-radius=8

# System stats: CPU graph + %, RAM bar + used, network up/down
[org/gnome/shell/extensions/astra-monitor]
theme-style='dark'
panel-box='right'
processor-header-show=true
processor-header-graph=true
processor-header-percentage=true
memory-header-show=true
memory-header-bars=true
memory-header-value=true
storage-header-show=false
network-header-show=true
network-header-graph=false
network-header-io=true

# Auto-tiling
[org/gnome/shell/extensions/forge]
window-gap-size=uint32 8
focus-border-toggle=true
focus-border-size=uint32 2
focus-border-color='rgba(122, 162, 247, 1)'
split-border-color='rgba(187, 154, 247, 1)'
preview-hint-enabled=true

[org/gnome/shell/extensions/just-perfection]
activities-button=false
startup-status=0
workspace-popup=false
window-demands-attention-focus=true
world-clock=false

# Open Bar paints the bar itself, so don't double-blur it
[org/gnome/shell/extensions/blur-my-shell/panel]
blur=false
