# Stock Ubuntu 26.04 look + system monitor in the top bar.
# Applied by scripts/stock-gnome.sh (which first resets everything rice.ini changed).
# Values below are the original settings captured in the baseline snapshot.

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='Yaru-dark'
icon-theme='Yaru-dark'
font-name='Ubuntu 11'
enable-hot-corners=true
show-battery-percentage=true

[org/gnome/desktop/background]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/Province_of_the_south_of_france_by_orbitelambda.jpg'
picture-uri-dark='file:///usr/share/backgrounds/Province_of_the_south_of_france_by_orbitelambda.jpg'

# Tiling Assistant (Ubuntu's built-in) manages these
[org/gnome/desktop/wm/keybindings]
maximize=@as []
unmaximize=@as []

[org/gnome/mutter]
dynamic-workspaces=true
edge-tiling=false

[org/gnome/mutter/keybindings]
toggle-tiled-left=@as []
toggle-tiled-right=@as []

[org/gnome/shell]
enabled-extensions=['ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com', 'ubuntu-appindicators@ubuntu.com', 'snapd-prompting@canonical.com', 'snapd-search-provider@canonical.com', 'web-search-provider@ubuntu.com', 'monitor@astraext.github.io']
disabled-extensions=@as []
favorite-apps=['org.gnome.Nautilus.desktop', 'snap-store_snap-store.desktop', 'firefox_firefox.desktop', 'google-chrome.desktop', 'brave-browser.desktop', 'torbrowser.desktop', 'org.gnome.Terminal.desktop', 'code_code.desktop', 'spotify_spotify.desktop']

[org/gnome/shell/extensions/dash-to-dock]
dock-fixed=true
dock-position='BOTTOM'
extend-height=true

# The part worth keeping: CPU graph + %, RAM bar + used, network up/down
[org/gnome/shell/extensions/astra-monitor]
theme-style='dark'
panel-box='right'
processor-header-show=true
processor-header-graph=true
processor-header-percentage=true
memory-header-show=true
memory-header-bars=true
memory-header-value=true
storage-header-show=false
network-header-show=true
network-header-graph=false
network-header-io=true
